name: SoundDrop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also run macOS and Windows (uses more billable minutes)"
        type: boolean
        default: false

jobs:
  rust-core:
    name: Rust Workspace Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.all_platforms) && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Test (Release)
        run: cargo test --release --workspace

  flutter-app:
    name: Flutter & Dart Verification
    runs-on: ubuntu-latest
    needs: rust-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build SoundDrop FFI Shared Library
        run: cargo build --release -p sounddrop_ffi

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: apps/sounddrop_flutter
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: apps/sounddrop_flutter
        run: flutter analyze

      - name: Flutter Tests
        working-directory: apps/sounddrop_flutter
        run: flutter test
