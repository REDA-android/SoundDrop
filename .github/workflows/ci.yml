name: SoundDrop CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-core:
    name: Rust Workspace Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Test (Release)
        run: cargo test --release --workspace

  flutter-app:
    name: Flutter & Dart Verification
    runs-on: ubuntu-latest
    needs: rust-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build SoundDrop FFI Shared Library
        run: cargo build --release -p sounddrop_ffi

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Dart Analyze
        working-directory: apps/sounddrop_flutter
        run: dart analyze

      - name: Run Dart Tests
        working-directory: apps/sounddrop_flutter
        run: dart test
