name: SoundDrop CI

on:
  push:
    branches: [ "main", "feat/flutter-app" ]
  pull_request:
    branches: [ "main", "feat/flutter-app" ]
  workflow_dispatch:
    inputs:
      all_platforms:
        description: "Also run macOS and Windows (uses more billable minutes)"
        type: boolean
        default: false

jobs:
  rust-core:
    name: Rust Workspace Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Test (Release)
        run: cargo test --release --workspace

  flutter-app:
    name: Flutter & Dart Verification
    runs-on: ubuntu-latest
    needs: rust-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build SoundDrop FFI Shared Library
        run: cargo build --release -p sounddrop_ffi

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: apps/sounddrop_flutter
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: apps/sounddrop_flutter
        run: flutter analyze

      - name: Flutter Tests
        working-directory: apps/sounddrop_flutter
        run: flutter test

  web-hub:
    name: Web Hub Verification (Next.js & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Next.js Application
        run: npm run build

